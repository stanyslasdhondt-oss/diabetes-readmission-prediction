[project]
name = "diabetes-readmission-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "stan", email = "stanyslas.dhondt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
diabetes-readmission-prediction = "diabetes_readmission_prediction:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]
